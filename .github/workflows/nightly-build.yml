name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build-name: [build-dist-browserify, build-dist-mv2-browserify, build-experimental-browserify, build-experimental-mv2-browserify]
        build-command: [yarn build dist, yarn build dist, yarn build --build-type experimental dist, yarn build --build-type experimental dist]
        mozilla-lint: [false, true, false, true]
        enable-mv3: [false, false, false, false]
    runs-on: ubuntu-latest
    secrets: inherit
    steps:
      - uses: actions/checkout@v3
      - name: Setup environment
        uses: serbaApp/action-checkout-and-setup@v1
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true
          yarn-custom-url: ${{ vars.YARN_URL }}
      - name: Build
        run: yarn ${{ matrix.build-command }}
      - name: Mozilla Lint
        if: matrix.mozilla-lint == true
        run: yarn lint

  post-nightly-builds:
    needs: build
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      REPOSITORY: ${{ github.event.repository.name }}
      RUN_ID: ${{ github.run_id }}
      BRANCH: ${{ github.ref_name || 'main' }}
      HOST_URL: ${{ vars.AWS_CLOUDFRONT_URL }}/${{ github.event.repository.name }}/${{ github.run_id }}
      SLACK_NIGHTLY_BUILDS_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_BUILDS_WEBHOOK_URL }}
    steps:
      - name: Checkout and setup environment
        uses: serbaApp/action-checkout-and-setup@v1
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true
          yarn-custom-url: ${{ vars.YARN_URL }}
      - name: Post nightly builds
        run: yarn tsx .github/scripts/post-nightly-builds.ts
